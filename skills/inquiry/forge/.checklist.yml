phases:
  - name: "prepare"
    checks:
      - id: "inputs"
        description: "Code, data, environment, and plan versions are recorded"
        evidence: "required"
      - id: "sanity"
        description: "A small end-to-end run validates data flow and metric computation"
        evidence: "required"
  - name: "execute"
    checks:
      - id: "runs"
        description: "Successful and failed runs have reproducible configurations and logs"
        evidence: "required"
      - id: "integrity"
        description: "Plan deviations and data-boundary checks are recorded"
        evidence: "required"
  - name: "package"
    checks:
      - id: "reproduction"
        description: "A representative result was regenerated from recorded inputs"
        evidence: "required"
      - id: "artifacts"
        description: "Run manifest and analysis inputs are available for independent review"
        evidence: "required"

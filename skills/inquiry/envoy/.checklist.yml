phases:
  - name: "structure"
    checks:
      - id: "argument"
        description: "Outline connects the contribution to supported claims"
        evidence: "required"
      - id: "sources"
        description: "Each factual claim has an attributable source or experiment artifact"
        evidence: "required"
  - name: "draft"
    checks:
      - id: "manuscript"
        description: "Draft and figures faithfully represent the research record"
        evidence: "required"
      - id: "integrity"
        description: "Citations, numbers, methods, and limitations were cross-checked"
        evidence: "required"
  - name: "review"
    checks:
      - id: "review"
        description: "Author review and unresolved issues are recorded"
        evidence: "required"
      - id: "package"
        description: "Requested manuscript or response package is complete for human review"
        evidence: "required"

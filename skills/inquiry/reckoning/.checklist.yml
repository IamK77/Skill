phases:
  - name: "audit"
    checks:
      - id: "population"
        description: "Included, excluded, failed, and missing runs are accounted for"
        evidence: "required"
      - id: "protocol"
        description: "Metric definitions and deviations are checked against the plan"
        evidence: "required"
  - name: "analyse"
    checks:
      - id: "effect"
        description: "Effect estimates, uncertainty, and failure regimes are documented"
        evidence: "required"
      - id: "alternatives"
        description: "Ablations or other evidence address plausible alternative explanations"
        evidence: "required"
  - name: "conclude"
    checks:
      - id: "claim"
        description: "Claims distinguish observations, interpretations, and uncertainty"
        evidence: "required"
      - id: "trace"
        description: "Conclusions link to retained analysis and source artifacts"
        evidence: "required"

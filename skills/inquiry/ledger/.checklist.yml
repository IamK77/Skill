phases:
  - name: "question"
    checks:
      - id: "claim"
        description: "Hypothesis, alternatives, and falsifying outcomes are explicit"
        evidence: "required"
      - id: "comparison"
        description: "Baselines and comparisons address the stated claim"
        evidence: "required"
  - name: "design"
    checks:
      - id: "protocol"
        description: "Data boundaries, metrics, repetitions, and analysis are specified"
        evidence: "required"
      - id: "budget"
        description: "Ablations, stopping conditions, and resource limits are recorded"
        evidence: "required"
  - name: "freeze"
    checks:
      - id: "review"
        description: "Feasibility and leakage review issues are resolved or named"
        evidence: "required"
      - id: "version"
        description: "The agreed plan is versioned with a deviation-recording convention"
        evidence: "required"

phases:
  - name: "plan"
    checks:
      - id: "decision"
        description: "Signals link to explicit release or product decisions"
        evidence: "required"
      - id: "boundary"
        description: "Environment, rollback, and telemetry/privacy boundaries are recorded"
        evidence: "required"
  - name: "instrument"
    checks:
      - id: "preview"
        description: "The changed journey is observable in the intended preview environment"
        evidence: "required"
      - id: "signals"
        description: "Health and event instrumentation were exercised with known cases"
        evidence: "required"
  - name: "handoff"
    checks:
      - id: "thresholds"
        description: "Baselines, thresholds, and their limitations are documented"
        evidence: "required"
      - id: "response"
        description: "Each material signal has an owner and response action"
        evidence: "required"

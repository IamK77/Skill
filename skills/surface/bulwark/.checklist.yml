phases:
  - name: "locate"
    checks:
      - id: "problem"
        description: "The maintenance problem is supported by concrete code/change evidence"
        evidence: "required"
      - id: "consumers"
        description: "Affected consumers and compatibility boundaries are known"
        evidence: "required"
  - name: "repair"
    checks:
      - id: "change"
        description: "The responsible boundary or abstraction is repaired"
        evidence: "required"
      - id: "guard"
        description: "A retained check detects a representative violation and the probe is restored"
        evidence: "required"
  - name: "handoff"
    checks:
      - id: "consumers"
        description: "Affected consumers and relevant checks were exercised"
        evidence: "required"
      - id: "migration"
        description: "Usage, migration guidance, and unresolved ownership are documented"
        evidence: "required"

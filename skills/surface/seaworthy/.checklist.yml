phases:
  - name: "states"
    checks:
      - id: "states"
        description: "Relevant async and failure states have expected visible outcomes"
        evidence: "required"
      - id: "constraints"
        description: "Supported input modes, devices, and performance requirements are explicit"
        evidence: "required"
  - name: "harden"
    checks:
      - id: "behaviour"
        description: "State transitions and recovery paths were exercised"
        evidence: "required"
      - id: "access"
        description: "Keyboard, semantic accessibility, and relevant performance checks are recorded"
        evidence: "required"
  - name: "handoff"
    checks:
      - id: "regressions"
        description: "Risky interaction and failure paths have retained tests"
        evidence: "required"
      - id: "limits"
        description: "Measured results and unsupported or unverified conditions are explicit"
        evidence: "required"

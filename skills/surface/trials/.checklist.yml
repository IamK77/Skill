phases:
  - name: "behaviour"
    checks:
      - id: "examples"
        description: "Tests are tied to concrete visible outcomes and failure cases"
        evidence: "required"
      - id: "level"
        description: "Test levels and substituted boundaries fit the actual risk"
        evidence: "required"
  - name: "exercise"
    checks:
      - id: "red"
        description: "The targeted fault made the test fail for the expected reason"
        evidence: "required"
      - id: "green"
        description: "The restored implementation and relevant suite passed, with logs retained"
        evidence: "required"
  - name: "handoff"
    checks:
      - id: "maintainable"
        description: "Tests retain meaningful assertions and deterministic setup"
        evidence: "required"
      - id: "coverage"
        description: "Execution environments and untested paths are explicit"
        evidence: "required"

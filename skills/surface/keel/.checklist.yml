phases:
  - name: "seams"
    checks:
      - id: "journey"
        description: "One concrete user journey and its acceptance outcome are agreed"
        evidence: "required"
      - id: "seams"
        description: "Integration seams and contract assumptions are explicit"
        evidence: "required"
  - name: "slice"
    checks:
      - id: "path"
        description: "The thin user-visible path runs through the intended seams"
        evidence: "required"
      - id: "contract"
        description: "Contracts are checked and substitutions or unresolved seams are named"
        evidence: "required"
  - name: "handoff"
    checks:
      - id: "reproduce"
        description: "The selected journey can be run from documented setup"
        evidence: "required"
      - id: "limits"
        description: "Failure behaviour and remaining integration gaps are recorded"
        evidence: "required"

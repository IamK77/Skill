phases:
  - name: "contract"
    checks:
      - id: "roles"
        description: "Token roles and representative component use cases are specified"
        evidence: "required"
      - id: "ownership"
        description: "Sources of truth, consumers, and exceptions are named"
        evidence: "required"
  - name: "implement"
    checks:
      - id: "artifacts"
        description: "Tokens and representative components exist as reusable artifacts"
        evidence: "required"
      - id: "examples"
        description: "Live examples cover relevant states, themes, and consumer integration"
        evidence: "required"
  - name: "handoff"
    checks:
      - id: "validation"
        description: "Implementation and relevant accessibility/visual checks are recorded"
        evidence: "required"
      - id: "adoption"
        description: "Usage, ownership, and version/migration guidance are documented"
        evidence: "required"

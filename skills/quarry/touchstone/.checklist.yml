phases:
  - name: "fit"
    checks:
      - id: "decision"
        description: "Use case, constraints, and evaluation scope are defined"
        evidence: "required"
      - id: "identity"
        description: "Candidate revision and dated primary sources are recorded"
        evidence: "required"
  - name: "inspect"
    checks:
      - id: "evidence"
        description: "Relevant capabilities and risks have inspectable source evidence"
        evidence: "required"
      - id: "trial"
        description: "Representative trial results or explicit untested limitations are recorded"
        evidence: "required"
  - name: "verdict"
    checks:
      - id: "tradeoffs"
        description: "Capability, cost, and maintenance tradeoffs are explicit"
        evidence: "required"
      - id: "recommendation"
        description: "Recommendation follows the intended use and cites decisive evidence"
        evidence: "required"

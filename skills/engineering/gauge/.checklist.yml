phases:
  - name: "baseline"
    checks:
      - id: "baseline"
        description: "Current configuration and diagnostic baseline are recorded"
        evidence: "required"
      - id: "goal"
        description: "Target error classes and acceptable adoption scope are named"
        evidence: "required"
  - name: "configure"
    checks:
      - id: "sensitivity"
        description: "A representative mistake was detected and the probe restored"
        evidence: "required"
      - id: "exceptions"
        description: "New suppressions or exclusions have explicit reasons"
        evidence: "required"
      - id: "static-checker-green"
        description: "Result of the agreed TYPECHECK_CMD command against the target project"
        verify: "shell:${TYPECHECK_CMD}"
        timeout: 300
        allow-na: true
  - name: "handoff"
    checks:
      - id: "workflow"
        description: "Reproducible invocation and integration location are documented"
        evidence: "required"
      - id: "ceiling"
        description: "Static guarantees and unchecked runtime behaviour are distinguished"
        evidence: "required"

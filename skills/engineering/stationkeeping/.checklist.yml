phases:
  - name: "prepare"
    checks:
      - id: "target"
        description: "Environment, operation, authority, and blast radius are unambiguous"
        evidence: "required"
      - id: "rollback"
        description: "Rollback path and success/abort thresholds are recorded and feasible"
        evidence: "required"
  - name: "operate"
    checks:
      - id: "baseline"
        description: "Pre-change health and relevant configuration are recorded"
        evidence: "required"
      - id: "operation"
        description: "Action, observed signals, and any rollback are logged"
        evidence: "required"
  - name: "handoff"
    checks:
      - id: "health"
        description: "Post-change checks cover the intended outcome and abort signals"
        evidence: "required"
      - id: "owner"
        description: "Operational record names current state, open issues, and next owner"
        evidence: "required"

phases:
  - name: "understand"
    checks:
      - id: "need"
        description: "Users, problem, and desired outcome are stated"
        evidence: "required"
      - id: "unknowns"
        description: "Material ambiguities and their decision owners are recorded"
        evidence: "required"
  - name: "specify"
    checks:
      - id: "examples"
        description: "Acceptance examples include meaningful boundaries and failure behaviour"
        evidence: "required"
      - id: "scope"
        description: "Non-goals, constraints, and unresolved decisions are explicit"
        evidence: "required"
  - name: "agree"
    checks:
      - id: "agreement"
        description: "The requirement has an attributable agreement or authoritative source"
        evidence: "required"
      - id: "handoff"
        description: "Implementation and test work can trace back to acceptance examples"
        evidence: "required"

phases:
  - name: "locate"
    checks:
      - id: "burden"
        description: "Concrete code or change evidence identifies the maintenance problem"
        evidence: "required"
      - id: "invariants"
        description: "Preserved behaviour and compatibility boundaries are explicit"
        evidence: "required"
  - name: "change"
    checks:
      - id: "safety"
        description: "Characterization or regression tests protect the affected behaviour"
        evidence: "required"
      - id: "refactor"
        description: "The intended simplification is implemented without unexplained parallel paths"
        evidence: "required"
  - name: "handoff"
    checks:
      - id: "verification"
        description: "Before/after verification results and any gaps are recorded"
        evidence: "required"
      - id: "migration"
        description: "Consumers can adopt or roll back the change with known limitations"
        evidence: "required"

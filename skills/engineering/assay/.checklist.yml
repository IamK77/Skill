phases:
  - name: "contract"
    checks:
      - id: "behaviour"
        description: "Acceptance examples name observable outcomes and relevant edge cases"
        evidence: "required"
      - id: "boundary"
        description: "Test level and any doubles preserve the behaviour under test"
        evidence: "required"
  - name: "exercise"
    checks:
      - id: "red"
        description: "The test failed on the targeted fault, not on setup or unrelated breakage"
        evidence: "required"
      - id: "restored"
        description: "Controlled faults are removed and the intended implementation is restored"
        evidence: "required"
      - id: "tests-green"
        description: "Result of the agreed TEST_CMD command against the target project"
        verify: "shell:${TEST_CMD}"
        timeout: 900
        allow-na: false
  - name: "handoff"
    checks:
      - id: "durable"
        description: "Regression tests are retained with maintainable fixtures"
        evidence: "required"
      - id: "limits"
        description: "Result summary distinguishes executed checks, exclusions, and remaining risk"
        evidence: "required"

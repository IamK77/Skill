phases:
  - name: "scope"
    checks:
      - id: "worktree"
        description: "Branch, existing changes, and ownership boundaries are recorded"
        evidence: "required"
      - id: "contract"
        description: "Required checks and the requested delivery boundary are known"
        evidence: "required"
  - name: "prepare"
    checks:
      - id: "diff"
        description: "The diff is focused and includes required source/generated artifacts"
        evidence: "required"
      - id: "repro"
        description: "Build and dependency reproduction evidence is recorded"
        evidence: "required"
      - id: "lint-green"
        description: "Result of the agreed LINT_CMD command against the target project"
        verify: "shell:${LINT_CMD}"
        timeout: 300
        allow-na: true
  - name: "handoff"
    checks:
      - id: "review"
        description: "Review notes include exact check results and unresolved issues"
        evidence: "required"
      - id: "delivery"
        description: "Any external delivery action has separate authorisation or is explicitly left pending"
        evidence: "required"

phases:
  - name: "scope"
    checks:
      - id: "boundary"
        description: "Threat model identifies assets, entry points, and trust boundaries"
        evidence: "required"
      - id: "permission"
        description: "Test scope and allowed actions are recorded"
        evidence: "required"
  - name: "defend"
    checks:
      - id: "findings"
        description: "Each finding has a reachable path, impact, and reproducible evidence"
        evidence: "required"
      - id: "repairs"
        description: "Changes and regression results are recorded, with unresolved findings explicit"
        evidence: "required"
      - id: "dependency-scan-clean"
        description: "Result of the agreed SCA_CMD command against the target project"
        verify: "shell:${SCA_CMD}"
        timeout: 300
        allow-na: true
  - name: "handoff"
    checks:
      - id: "risk"
        description: "Residual risks and validation limits are explicit"
        evidence: "required"
      - id: "report"
        description: "Review report links findings, changes, and test artifacts"
        evidence: "required"

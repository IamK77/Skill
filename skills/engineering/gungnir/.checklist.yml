phases:
  - name: "authorise"
    checks:
      - id: "scope"
        description: "Target, authority, allowed actions, and stop conditions are recorded"
        evidence: "required"
      - id: "hypothesis"
        description: "The suspected trust-boundary violation is stated as a testable hypothesis"
        evidence: "required"
  - name: "reproduce"
    checks:
      - id: "trace"
        description: "The reachable path and required attacker capabilities are evidenced"
        evidence: "required"
      - id: "reproduction"
        description: "A safe reproduction or a documented failed attempt supports the finding"
        evidence: "required"
  - name: "report"
    checks:
      - id: "finding"
        description: "Report includes affected versions, steps, impact, and uncertainty"
        evidence: "required"
      - id: "cleanup"
        description: "Test artifacts and sensitive material are handled within the agreed scope"
        evidence: "required"

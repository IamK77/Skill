name: checklist-bundle

# Verify before merge. Never silently repair and push generated code after merge.
on:
  push:
    branches: [main]
    paths: ['devtools/checklist/**', '.github/workflows/checklist-bundle.yml']
  pull_request:
    paths: ['devtools/checklist/**', '.github/workflows/checklist-bundle.yml']

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devtools/checklist
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: devtools/checklist/package-lock.json
      - run: npm ci
      - run: npm run bundle:check

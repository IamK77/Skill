name: touchstone-artifacts

# Retained for explicit historical maintenance only. The A/B platform is no
# longer an active development focus; ordinary skill changes must not trigger
# artifact rebuilding or automatic push-back. No platform files are deleted.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: touchstone-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild artifacts for every skill that has an eval set
        run: |
          shopt -s nullglob
          for p in touchstone/evals/*/*/profile.json; do
            skill="${p#touchstone/evals/}"; skill="${skill%/profile.json}"
            echo "::group::build $skill"
            node touchstone/build-artifact.mjs --skill "$skill"
            echo "::endgroup::"
          done
      - name: Commit back if the artifacts changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add touchstone/artifacts
          if git diff --cached --quiet; then
            echo "artifacts already up to date — nothing to commit"
          else
            git commit -m "chore(touchstone): rebuild artifacts [skip ci]"
            git push
          fi

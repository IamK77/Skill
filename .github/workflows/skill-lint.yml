name: skill-lint

# Shared type-aware contract plus real YAML/command parity across all suites.
on:
  push:
    branches: [main]
    paths: ['.gitignore', '.claude-plugin/**', 'skills/**', 'devtools/skill*', 'devtools/test_*.py', 'devtools/checklist/**', '.github/workflows/skill-lint.yml']
  pull_request:
    paths: ['.gitignore', '.claude-plugin/**', 'skills/**', 'devtools/skill*', 'devtools/test_*.py', 'devtools/checklist/**', '.github/workflows/skill-lint.yml']

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python3 devtools/skill-lint.py
      - run: python3 -m unittest discover -s devtools -p 'test_*.py'
      - run: npm ci
        working-directory: devtools/checklist
      - run: npm run build
        working-directory: devtools/checklist
      - run: node devtools/checklist/dist/index.js lint skills --strict

name: atelier

# Type-aware authoring checks for atelier: heuristics stay ungated; the systems
# SOP carries an explicit lifecycle. Full YAML/command parity runs in skill-lint;
# behavioural probe tests remain in probe.yml.

on:
  push:
    branches: [main]
    paths: ['skills/atelier/**', 'devtools/atelier-lint.py', '.github/workflows/atelier.yml']
  pull_request:
    paths: ['skills/atelier/**', 'devtools/atelier-lint.py', '.github/workflows/atelier.yml']

permissions:
  contents: read

concurrency:
  group: atelier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: structural / gate-integrity lint
        run: python3 devtools/atelier-lint.py

name: ci

# Build/test the CLI and its workflow trigger contracts, including probe.yml.
# Requiring a green run before merge is a separate repository setting.

on:
  push:
    branches: [main]
    paths: ['devtools/checklist/**', '.github/workflows/ci.yml', '.github/workflows/probe.yml', '.github/workflows/release-please.yml']
  pull_request:
    paths: ['devtools/checklist/**', '.github/workflows/ci.yml', '.github/workflows/probe.yml', '.github/workflows/release-please.yml']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devtools/checklist
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: devtools/checklist/package-lock.json
      - name: Install the same pinned npm used by publishing
        run: npm install -g npm@12.2.0
      - run: npm ci
      - run: npm run build
      - run: npm test
